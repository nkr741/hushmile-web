<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://ntfy.sh; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Hushmile · How is the journey going?</title>
  <style>
    :root { --bg:#fff; --card:#f6f7f9; --fg:#16181d; --muted:#4f5663; --line:#e2e5ea; --calm:#1b7f4e; --checkin:#a15c00; --help:#b42318; --quiet:#4f5663; --blue:#2f6bff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#061018; --card:#10192a; --fg:#f7f9fc; --muted:#b7c3d4; --line:#2a3a52; --calm:#4cc38a; --checkin:#f5b547; --help:#ff7a70; --quiet:#b7c3d4; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    header .mark { width:40px; height:40px; border-radius:12px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; }
    h1 { font-size: 20px; margin: 0; }
    .hero { border-radius: 24px; padding: 18px; border: 1.5px solid var(--tone); background: color-mix(in srgb, var(--tone) 8%, var(--bg)); }
    .band { color: var(--tone); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
    .sentence { font-size: 22px; font-weight: 700; margin: 8px 0 12px; line-height: 1.3; }
    .facts { display:flex; flex-wrap:wrap; gap: 8px 18px; font-weight: 600; }
    form { display:flex; gap:8px; margin-top: 12px; }
    input { flex:1; font-size: 20px; letter-spacing: 2px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); min-height: 52px; }
    button { font-size: 17px; font-weight: 700; padding: 0 18px; border-radius: 14px; border: 0; background: var(--blue); color: #fff; min-height: 52px; min-width: 52px; cursor: pointer; }
    .note { color: var(--muted); font-size: 15px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <header><div class="mark" aria-hidden="true">H</div><h1>Hushmile</h1></header>
    <section id="status" class="hero" style="--tone: var(--quiet)" aria-live="polite">
      <div class="band" id="band">Journey</div>
      <div class="sentence" id="sentence">Enter the Journey Code you were sent.</div>
      <div class="facts"><span id="last"></span><span id="left"></span></div>
    </section>
    <form id="form" autocomplete="off">
      <label for="code" class="visually-hidden" style="position:absolute;left:-9999px">Journey Code</label>
      <input id="code" name="code" placeholder="ABCD-EFGH" inputmode="text" autocapitalize="characters" maxlength="12">
      <button type="submit">Open</button>
    </form>
    <p class="note">Read-only. The code stays in this page's address after the #, which is not sent to the web server. Updates are decrypted in this browser. Updates every minute. Hushmile is not an emergency service. <a href="./privacy.html">Privacy</a></p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
