<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.hushmile.com https://ntfy.sh https://tiles.openfreemap.org; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <title>Hushmile · How is the journey going?</title>
  <style>
    :root { --bg:#fff; --card:#f6f7f9; --fg:#16181d; --muted:#4f5663; --line:#e2e5ea; --calm:#1b7f4e; --checkin:#a15c00; --help:#b42318; --quiet:#4f5663; --blue:#2d69fc; --link:#2d69fc; }
    @media (prefers-color-scheme: dark) { :root { --bg:#061018; --card:#10192a; --fg:#f7f9fc; --muted:#b7c3d4; --line:#2a3a52; --calm:#4cc38a; --checkin:#f5b547; --help:#ff7a70; --quiet:#b7c3d4; --link:#8ab0ff; } }
    a { color: var(--link); }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    header .lang { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:15px; color:var(--muted); }
    select { font-size:16px; padding:6px 8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); max-width:100%; }
    header .mark { width:40px; height:40px; border-radius:12px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; }
    h1 { font-size: 20px; margin: 0; }
    .hero { border-radius: 24px; padding: 18px; border: 1.5px solid var(--tone); background: color-mix(in srgb, var(--tone) 8%, var(--bg)); }
    .band { color: var(--tone); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
    .sentence { font-size: 22px; font-weight: 700; margin: 8px 0 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .facts { display:flex; flex-wrap:wrap; gap: 8px 18px; font-weight: 600; }
    .roads { margin-top: 10px; font-size: 1.05rem; line-height: 1.4; } .roads div + div { margin-top: 4px; }
    form { display:flex; gap:8px; margin-top: 12px; }
    input { flex:1; min-width:0; width:100%; font-size: 20px; letter-spacing: 2px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); min-height: 52px; }
    button { flex:none; font-size: 17px; font-weight: 700; padding: 0 18px; border-radius: 14px; border: 0; background: var(--blue); color: #fff; min-height: 52px; min-width: 52px; cursor: pointer; }
    .note { color: var(--muted); font-size: 15px; margin-top: 18px; }
    .map-box { margin-top: 16px; } #map { height: min(56vh, 360px); min-height: 240px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; background: var(--card); }
    .map-note { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--muted); font-size: 14px; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; } .legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
    .hm-start { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 5px solid #1b7f4e; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .hm-vehicle { width: 34px; height: 34px; border-radius: 50%; background: #0e7c66; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: grid; place-items: center; }
    .hm-vehicle.stale { background: #5f6673; } .hm-vehicle.no-heading .hm-arrow { display: none; } .hm-vehicle.no-heading::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
    .maplibregl-ctrl-group button { width: 40px; height: 40px; } .maplibregl-ctrl-group .hm-fit { color: #2d69fc; display: grid; place-items: center; }
    .leaflet-tooltip { font: 600 14px/1.3 system-ui, sans-serif; }
    .sos { border-radius: 20px; padding: 16px; margin-bottom: 12px; background: #b42318; color: #fff; }
    .sos h2 { margin: 0 0 6px; font-size: 1.3rem; } .sos p { margin: 4px 0; line-height: 1.4; }
    .sos .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .sos a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 16px; border-radius: 22px; background: #fff; color: #8e1b24; font-weight: 700; text-decoration: none; }
    .help { border-radius: 20px; padding: 14px; margin-top: 12px; background: var(--card); border: 1px solid var(--line); }
    .help h2 { margin: 0 0 8px; font-size: 1.1rem; } .help .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .help a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
    .help .small { color: var(--muted); font-size: .9rem; margin-top: 6px; }
    #not-from-phone { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <header><div class="mark" aria-hidden="true">H</div><h1>Hushmile</h1><label class="lang"><span id="lang-label">Language</span><select id="lang"></select></label></header>
    <section id="sos" class="sos" role="alert" hidden><h2 id="sos-title"></h2><p id="sos-body"></p><p id="sos-sub"></p><div id="sos-links" class="links"></div></section>
    <section id="status" class="hero" style="--tone: var(--quiet)" aria-live="polite">
      <div class="band" id="band">Journey</div>
      <div class="sentence" id="sentence">Enter the Journey Code you were sent.</div>
      <div class="facts"><span id="last"></span><span id="left"></span><span id="speed"></span><span id="battery"></span></div>
      <div id="roads" class="roads" hidden></div>
      <div id="not-from-phone" class="small" hidden></div>
    </section>
    <section id="help" class="help" hidden><h2 id="help-title"></h2><div id="help-links" class="links"></div><div id="help-search" class="links" style="margin-top:8px"></div><div id="help-note" class="small"></div></section>
    <section id="map-box" class="map-box" hidden><div id="map" role="region" aria-label="Map of the journey"></div><div class="legend"><span id="legend-planned"><i style="background:#2d69fc"></i><span id="legend-planned-text"></span></span><span id="legend-driven" hidden><i style="background:#0e7c66"></i><span id="legend-driven-text"></span></span></div><div id="map-note" class="map-note"></div></section>
    <form id="form" autocomplete="off">
      <label for="code" id="code-label" class="visually-hidden" style="position:absolute;left:-9999px">Journey Code</label>
      <input id="code" name="code" placeholder="ABCD-EFGH" inputmode="text" autocapitalize="characters" maxlength="200">
      <button type="submit" id="open">Open</button>
    </form>
    <p class="note"><span id="note-text">Read-only. The code stays in this page's address after the #, which is not sent to the web server. Updates are decrypted in this browser. Updates every minute. Hushmile is not an emergency service. </span><a id="privacy" href="./privacy.html">Privacy</a></p>
  </main>
  <script src="./vendor/leaflet.js"></script>
  <!-- Ed25519 check for browsers without it in WebCrypto (TweetNaCl, public domain). -->
  <script src="./vendor/nacl.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
