<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.hushmile.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>Hushmile · Group headcount</title>
  <style>
    :root { --bg:#fff; --card:#f6f7f9; --fg:#16181d; --muted:#4f5663; --line:#e2e5ea; --ok:#1b7f4e; --warn:#a15c00; --blue:#2d69fc; --link:#2d69fc; }
    @media (prefers-color-scheme: dark) { :root { --bg:#061018; --card:#10192a; --fg:#f7f9fc; --muted:#b7c3d4; --line:#2a3a52; --ok:#4cc38a; --warn:#f5b547; --link:#8ab0ff; } }
    * { box-sizing: border-box; }
    a { color: var(--link); }
    body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
    header .mark { width:40px; height:40px; border-radius:12px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; }
    header .lang { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:15px; color:var(--muted); }
    h1 { font-size: 20px; margin: 0; } h2 { font-size: 18px; margin: 18px 0 8px; }
    select, input, textarea { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); max-width: 100%; }
    textarea { width: 100%; margin: 8px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin: 12px 0; }
    .big { font-size: 24px; font-weight: 800; } .sub { color: var(--muted); } .warn { color: var(--warn); font-weight: 700; }
    .count { font-size: 18px; font-weight: 700; margin-top: 8px; }
    .row { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: flex-end; }
    .field { display:flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); } .field input { width: 9rem; }
    button, .btn { font: inherit; font-weight: 700; padding: 0 16px; border-radius: 14px; border: 0; background: var(--blue); color: #fff; min-height: 48px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .ghost { background: transparent; color: var(--link); border: 1.5px solid var(--line); }
    .link { background: none; color: var(--link); padding: 0 6px; min-height: 40px; font-weight: 600; }
    .people { list-style: none; padding: 0; margin: 0; }
    .person { display:flex; flex-wrap: wrap; align-items:center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .person .name { flex: 1 1 10rem; font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
    .person.back .name { color: var(--muted); } .ok { color: var(--ok); font-weight: 700; }
    .note { color: var(--muted); font-size: 15px; margin-top: 14px; }
  </style>
</head>
<body>
  <main id="tour-page">
    <header>
      <div class="mark" aria-hidden="true">H</div>
      <h1 id="title">Group headcount</h1>
      <label class="lang"><span id="lang-label">Language</span> <select id="lang"></select></label>
    </header>
    <div id="body" aria-live="polite"></div>
    <p class="note"><a id="privacy" href="./privacy.html">Privacy</a></p>
  </main>
  <script type="module" src="./tour.js"></script>
</body>
</html>
